<!DOCTYPE html>
<html lang="et">

<head>
<meta charset="UTF-8">
<title>WanderWorld</title>

<style>

body {
  background: #222;
  color: white;
  font-family: Arial;
  text-align: center;
}

#world {
  width: 800px;
  height: 600px;
  background: #5cab5c;
  border: 4px solid white;
  margin: auto;
  position: relative;
  overflow: hidden;
}

.player {
  position: absolute;
  text-align: center;
}

.player img {
  width: 32px;
  height: 32px;
  image-rendering: pixelated;
}

.name {
  font-size: 12px;
}

.bubble {
  background: white;
  color: black;
  padding: 4px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 4px;
}

#controls {
  margin: 20px;
}

</style>
</head>

<body>

<h1>WanderWorld</h1>

<div id="controls">

<input id="username" placeholder="nimi">
<button onclick="joinGame()">Join</button>

<br><br>

<input id="message" placeholder="ütle midagi">
<button onclick="talk()">Talk</button>

</div>

<div id="world"></div>

<script>

const URL = "https://tinkr.tech/sdb/poly/wander";

let playerKey = localStorage.getItem("player_key");

async function joinGame() {

  let username = document.getElementById("username").value;

  let response = await fetch(URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: "join",
      username: username
    })
  });

  let data = await response.json();

  console.log(data);

  if (data.ok) {

    playerKey = data.player_key;

    localStorage.setItem("player_key", playerKey);

    alert("Joined!");

  } else {

    alert(data.error);

  }

}

async function loadWorld() {

  let response = await fetch(URL);

  let state = await response.json();

  console.log(state);

  let world = document.getElementById("world");

  world.innerHTML = "";

  for (let player of state.players) {

    let div = document.createElement("div");

    div.className = "player";

    div.style.left = player.x + "px";
    div.style.top = player.y + "px";

    if (player.message) {

      let bubble = document.createElement("div");

      bubble.className = "bubble";

      bubble.innerText = player.message;

      div.appendChild(bubble);

    }

    let img = document.createElement("img");

    img.src = "https://tinkr.tech" + player.image;

    div.appendChild(img);

    let name = document.createElement("div");

    name.className = "name";

    name.innerText = player.username;

    div.appendChild(name);

    world.appendChild(div);

  }

}

async function move(x, y) {

  if (!playerKey) {
    alert("Join first");
    return;
  }

  let response = await fetch(URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: "move",
      player_key: playerKey,
      x: x,
      y: y
    })
  });

  let data = await response.json();

  console.log(data);

}

async function talk() {

  if (!playerKey) {
    alert("Join first");
    return;
  }

  let message = document.getElementById("message").value;

  let response = await fetch(URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: "talk",
      player_key: playerKey,
      message: message
    })
  });

  let data = await response.json();

  console.log(data);

}

document.getElementById("world").addEventListener("click", function(event) {

  let rect = this.getBoundingClientRect();

  let x = event.clientX - rect.left;

  let y = event.clientY - rect.top;

  move(Math.floor(x), Math.floor(y));

});

loadWorld();

setInterval(loadWorld, 1000);

</script>

</body>
</html>
