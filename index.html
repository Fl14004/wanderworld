<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<title>WanderWorld</title>

<style>

body{
    background-color:#222;
    color:white;
    font-family: Arial, sans-serif;
    text-align:center;
    margin:0;
    padding:0;
}

#world{
    width:800px;
    height:600px;
    margin:20px auto;
    background:#5cab5c;
    border:4px solid #fff;
    position:relative;
    overflow:hidden;

}

.player{
    position:absolute;
    text-align:center;
    user-select:none;
}

.player img{
    width:32px;
    height:32px;
    image-rendering:pixelated;
}

.name{
    font-size:12px;
    margin-top:2px;
    text-shadow:1px 1px 2px black;
}

.bubble{
    background:white;
    color:black;
    border-radius:7px;
    padding:4px 6px;
    font-size:12px;
    margin-bottom:4px;
    display:inline-block;
    max-width:120px;
    word-wrap:break-word;
}

#controls{
    margin-top:20px;
}

input{
    padding:6px;
    border:none;
    border-radius:4px;
}

button{
    padding:6px 10px;
    cursor:pointer;
    border:none;
    border-radius:4px;
}

button:hover{
    opacity:0.9;
}

</style>
</head>

<body>

<h1>WanderWorld</h1>

<div id="controls">

    <input type="text" id="username" placeholder="nimi">
    <button onclick="joinGame()">Join</button>

    <br><br>

    <input type="text" id="message" placeholder="ütle midagi">
    <button onclick="sendMessage()">Talk</button>

</div>

<div id="world"></div>

<script>

const serverUrl = "https://tinkr.tech/sdb/poly/wander";

let savedKey = localStorage.getItem("player_key");
let worldBox = document.getElementById("world");


async function joinGame(){

    let usernameInput = document.getElementById("username");
    let username = usernameInput.value.trim();

    if(username === ""){
        alert("Sisesta nimi");
        return;
    }

    try{

        let req = await fetch(serverUrl,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                action:"join",
                username:username
            })
        });

        let result = await req.json();

        console.log("join response:", result);

        if(result.ok){

            savedKey = result.player_key;

            localStorage.setItem("player_key", savedKey);

            alert("Successfully joined");

        }else{
            alert(result.error || "something went wrong");
        }

    }catch(err){

        console.log(err);
        alert("server error");

    }

}


async function refreshWorld(){

    try{

        let req = await fetch(serverUrl);
        let data = await req.json();

        // quick reset
        worldBox.innerHTML = "";

        for(let i = 0; i < data.players.length; i++){

            let currentPlayer = data.players[i];

            let playerDiv = document.createElement("div");
            playerDiv.className = "player";

            playerDiv.style.left = currentPlayer.x + "px";
            playerDiv.style.top = currentPlayer.y + "px";

            if(currentPlayer.message && currentPlayer.message !== ""){

                let msg = document.createElement("div");
                msg.className = "bubble";
                msg.innerText = currentPlayer.message;

                playerDiv.appendChild(msg);
            }

            let skin = document.createElement("img");

            skin.src = "https://tinkr.tech" + currentPlayer.image;

            playerDiv.appendChild(skin);

            let usernameText = document.createElement("div");
            usernameText.className = "name";
            usernameText.innerText = currentPlayer.username;

            playerDiv.appendChild(usernameText);

            worldBox.appendChild(playerDiv);

        }

    }catch(e){

        console.log("failed loading world");
        console.log(e);

    }

}


async function movePlayer(posX, posY){

    if(!savedKey){
        alert("Join first");
        return;
    }

    let sendData = {
        action:"move",
        player_key:savedKey,
        x:posX,
        y:posY
    };

    try{

        let req = await fetch(serverUrl,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(sendData)
        });

        let data = await req.json();

        console.log("move:", data);

    }catch(err){

        console.log(err);

    }

}


async function sendMessage(){

    if(savedKey == null){
        alert("Join first");
        return;
    }

    let msgInput = document.getElementById("message");
    let text = msgInput.value;

    if(text.trim() === ""){
        return;
    }

    try{

        let response = await fetch(serverUrl,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                action:"talk",
                player_key:savedKey,
                message:text
            })
        });

        let resData = await response.json();

        console.log(resData);

        msgInput.value = "";

    }catch(error){

        console.log("message failed");
        console.log(error);

    }

}



worldBox.addEventListener("click", function(e){

    let rect = worldBox.getBoundingClientRect();

    let clickX = e.clientX - rect.left;
    let clickY = e.clientY - rect.top;

    movePlayer(Math.floor(clickX), Math.floor(clickY));

});


refreshWorld();

setInterval(function(){

    refreshWorld();

}, 1000);

</script>

</body>
</html>
